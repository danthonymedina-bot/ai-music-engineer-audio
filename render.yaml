# Render blueprint — CPU-only beta. Free tier (512 MB RAM) is too small for Demucs; use standard (2 GB RAM, CPU).
services:
  - type: web
    name: ai-music-engineer-audio
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard            # CPU-only, 2 GB RAM. Not "free": Demucs OOMs at 512 MB.
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: AUDIO_ENGINE_API_KEY
        sync: false           # set the secret value in the Render dashboard; never committed
      - key: AUDIO_ENGINE_STORAGE
        value: /data
      - key: AUDIO_ENGINE_MAX_UPLOAD_MB
        value: "50"
      - key: AUDIO_ENGINE_MAX_DURATION_S
        value: "600"
      - key: RATE_SEPARATE_PER_HOUR
        value: "10"
      - key: RATE_PROCESS_PER_HOUR
        value: "60"
    disk:
      name: audio-data
      mountPath: /data
      sizeGB: 10
